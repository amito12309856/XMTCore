name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows binaries (AVX2 + generic)
        shell: pwsh
        run: |
          gcc -O3 -std=c11 -flto -DNDEBUG -Isrc/fathom -c src/fathom/tbprobe.c -o tbprobe.o
          g++ -O3 -std=c++17 -march=x86-64-v3 -flto -DNDEBUG -static -Isrc/fathom -o XMTCore.exe src/chess.cpp src/eval.cpp src/nn.cpp src/search.cpp src/syzygy.cpp src/main.cpp tbprobe.o -pthread
          g++ -O3 -std=c++17 -march=x86-64 -flto -DNDEBUG -static -Isrc/fathom -o XMTCore-generic.exe src/chess.cpp src/eval.cpp src/nn.cpp src/search.cpp src/syzygy.cpp src/main.cpp tbprobe.o -pthread
          Remove-Item tbprobe.o -Force
      - name: Package
        shell: pwsh
        run: |
          $name = "XMTCore-${{ github.ref_name }}-win64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item XMTCore.exe, XMTCore-generic.exe, LICENSE, README.md $name
          Copy-Item weights/xmtcore.nn $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: XMTCore-*-win64.zip
